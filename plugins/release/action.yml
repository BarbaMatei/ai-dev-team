name: release
description: Work out each package's next version from conventional commits, push the release commits and tags and create the GitHub releases.
inputs:
  node-version:
    description: Node version used to run the release script
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Release
      shell: bash
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        out="$RUNNER_TEMP/release-output.txt"
        node "$GITHUB_ACTION_PATH/scripts/release.mjs" --write | tee "$out"
        if ! grep -q '^release ' "$out"; then
          echo "nothing to release"
          exit 0
        fi
        git push --atomic origin "HEAD:${GITHUB_REF_NAME}" --follow-tags
        failed=""
        while read -r kind name version tag notes; do
          if [ "$kind" = "release" ]; then
            if GH_TOKEN="${{ github.token }}" gh release create "$tag" --title "$name $version" --notes-file "$notes"; then
              echo "released $name $version as $tag"
            else
              failed="$failed $tag"
            fi
          fi
        done < "$out"
        if [ -n "$failed" ]; then
          echo "no release page for:$failed"
          exit 1
        fi
